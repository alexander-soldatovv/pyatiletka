services:
  app:
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_PATH: /data/pyatiletka.sqlite
      NODE_EXTRA_CA_CERTS: /app/certs/russian_trusted_ca.pem
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
